plugins {
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.copperironalloy'

base {
    archivesName = 'copper_iron_alloy_tfc'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com/' }
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    // TerraFirmaCraft 3.2.12 for 1.20.1 — compile against the real jar
    compileOnly files('libs/TerraFirmaCraft-Forge-1.20.1-3.2.12.jar')
    // JEI is optional at runtime. The plugin is not loaded unless JEI is installed.
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.20.0.106')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.20.0.106')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'copper_iron_alloy',
            'Specification-Vendor'    : 'dsh',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'dsh'
        ])
    }
}
